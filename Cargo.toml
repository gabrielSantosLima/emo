[workspace]
resolver = "3"
members = ["crates/emo-apu", "crates/emo-cli", "crates/emo-core", "crates/emo-cpu", "crates/emo-ppu"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/gabrielSantosLima/emo"
authors = ["Gabriel Santos Lima"]
description = "A from-scratch Super Nintendo Entertainment System emulator."

[workspace.dependencies]
# Shared dependency versions. Crates opt in when they actually need the crate.
emo-core = { path = "crates/emo-core" }
emo-cpu = { path = "crates/emo-cpu" }
emo-ppu = { path = "crates/emo-ppu" }
emo-apu = { path = "crates/emo-apu" }
thiserror = "2.0"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Called by the Release workflow so quality gates run before tagging.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Runs only after the Release workflow finishes: builds the binaries for the
  # tag that workflow just published and attaches them to that release.
  publish:
    name: publish (${{ matrix.platform }})
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    needs: [format, clippy, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
          - os: windows-latest
            platform: windows
            archive: zip
          - os: macos-latest
            platform: macos
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.platform }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 --match 'v*')
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag found at $GITHUB_SHA" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: cargo build --release --locked --workspace --bins

      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="emo-${VERSION}-${PLATFORM}-$(uname -m)"
          if [ "$ARCHIVE_KIND" = "zip" ]; then
            7z a "${NAME}.zip" ./target/release/emo.exe
            ARCHIVE="${NAME}.zip"
          else
            tar -czf "${NAME}.tar.gz" -C target/release emo
            ARCHIVE="${NAME}.tar.gz"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
